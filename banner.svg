<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Graph Theory and Algorithms - GATE CSE master notes" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f19"/>
      <stop offset="1" stop-color="#111b33"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="1" stop-color="#7cffb2"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1b2740" stroke-width="1"/>
    </pattern>
    <style>
      .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
      .flow { stroke-dasharray: 6 8; animation: flow 1.6s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -28; } }
      .pulse { animation: pulse 2.4s ease-in-out infinite; }
      @keyframes pulse { 0%, 100% { opacity: .65; } 50% { opacity: 1; } }
      .cursor { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <!-- frame -->
  <rect width="1200" height="320" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="16" fill="url(#grid)" opacity=".55"/>
  <rect x="1" y="1" width="1198" height="318" rx="15" fill="none" stroke="#00e5ff" stroke-opacity=".35"/>

  <!-- terminal title bar -->
  <circle cx="36" cy="32" r="6" fill="#ff5f56"/>
  <circle cx="58" cy="32" r="6" fill="#ffbd2e"/>
  <circle cx="80" cy="32" r="6" fill="#27c93f"/>
  <text x="104" y="37" class="mono" font-size="14" fill="#6b7a99">~/gate-cse/graphs  -  zsh</text>
  <line x1="24" y1="52" x2="1176" y2="52" stroke="#1f2d4d"/>

  <!-- left: text block -->
  <text x="48" y="100" class="mono" font-size="18" fill="#7cffb2">$ gate-cse --topic graphs --mode master<tspan class="cursor" fill="#00e5ff"> █</tspan></text>
  <text x="48" y="172" class="mono" font-size="56" font-weight="700" fill="url(#title)" filter="url(#glow)">GRAPH THEORY</text>
  <text x="48" y="236" class="mono" font-size="56" font-weight="700" fill="url(#title)" filter="url(#glow)">&amp; ALGORITHMS</text>
  <text x="48" y="282" class="mono" font-size="18" fill="#8ea0c4">structure  ·  traversal  ·  optimization</text>

  <!-- right: network -->
  <g opacity=".3">
    <circle cx="760" cy="90" r="4" fill="#00e5ff"/>
    <circle cx="830" cy="285" r="4" fill="#a855f7"/>
    <circle cx="1160" cy="95" r="4" fill="#22c55e"/>
    <circle cx="1090" cy="285" r="4" fill="#ec4899"/>
  </g>

  <!-- edges -->
  <line x1="800" y1="170" x2="900" y2="85"  stroke="#22c55e" stroke-width="2.5" class="flow"/>
  <line x1="800" y1="170" x2="900" y2="255" stroke="#22c55e" stroke-width="2.5" class="flow"/>
  <line x1="900" y1="85"  x2="1010" y2="130" stroke="#22c55e" stroke-width="2.5" class="flow"/>
  <line x1="1010" y1="130" x2="1120" y2="175" stroke="#22c55e" stroke-width="2.5" class="flow"/>
  <line x1="900" y1="255" x2="1010" y2="225" stroke="#0ea5e9" stroke-width="2"/>
  <line x1="1010" y1="225" x2="1120" y2="175" stroke="#0ea5e9" stroke-width="2"/>
  <line x1="900" y1="85"  x2="900" y2="255" stroke="#ef4444" stroke-width="2" stroke-dasharray="5 6" opacity=".7"/>
  <line x1="1010" y1="130" x2="1010" y2="225" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5 6" opacity=".7"/>

  <!-- nodes -->
  <g class="mono" font-size="14" font-weight="700" text-anchor="middle" filter="url(#glow)">
    <g class="pulse"><circle cx="800" cy="170" r="16" fill="#0b0f19" stroke="#22c55e" stroke-width="2.5"/><text x="800" y="175" fill="#22c55e">A</text></g>
    <g class="pulse" style="animation-delay:.3s"><circle cx="900" cy="85" r="16" fill="#0b0f19" stroke="#00e5ff" stroke-width="2.5"/><text x="900" y="90" fill="#00e5ff">B</text></g>
    <g class="pulse" style="animation-delay:.6s"><circle cx="900" cy="255" r="16" fill="#0b0f19" stroke="#00e5ff" stroke-width="2.5"/><text x="900" y="260" fill="#00e5ff">C</text></g>
    <g class="pulse" style="animation-delay:.9s"><circle cx="1010" cy="130" r="16" fill="#0b0f19" stroke="#a855f7" stroke-width="2.5"/><text x="1010" y="135" fill="#a855f7">D</text></g>
    <g class="pulse" style="animation-delay:1.2s"><circle cx="1010" cy="225" r="16" fill="#0b0f19" stroke="#ec4899" stroke-width="2.5"/><text x="1010" y="230" fill="#ec4899">E</text></g>
    <g class="pulse" style="animation-delay:1.5s"><circle cx="1120" cy="175" r="16" fill="#0b0f19" stroke="#f59e0b" stroke-width="2.5"/><text x="1120" y="180" fill="#f59e0b">F</text></g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
